name: Prepare Railway landing catalog

on:
  push:
    branches: [main]
    paths:
      - "data/*-businesses.json"
      - "data/site-specs/*.json"
      - "data/frontends/**"
      - "scripts/detect-deploy-runs.mjs"
      - "scripts/generate-deploy-runs.mjs"
      - "scripts/build-vercel-catalog.mjs"
      - "src/delivery/create-final-study.ts"
      - ".github/workflows/publish-railway.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: railway-catalog-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - name: Detect all deployable runs
        id: detect
        run: node scripts/detect-deploy-runs.mjs --event-name workflow_dispatch
      - name: Generate and validate complete catalog
        env:
          RUNS_JSON: ${{ steps.detect.outputs.runs }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test "$RUNS_JSON" != '[]'
          node scripts/generate-deploy-runs.mjs --runs "$RUNS_JSON" --client-readiness warn
          node scripts/build-vercel-catalog.mjs --runs "$RUNS_JSON" --out dist/vercel-catalog
      - name: IMPECCABLE advisory scan
        continue-on-error: true
        run: npm run qa:impeccable -- generated
      - name: Version verified public artifact
        run: |
          test -f dist/vercel-catalog/index.html
          test -f dist/vercel-catalog/catalog/index.html
          rm -rf production
          mkdir production
          cp -a dist/vercel-catalog/. production/
          git add production
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish validated Railway catalog artifact"
          git push origin HEAD:main

